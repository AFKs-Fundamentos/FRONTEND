<app-card
  [contentTitle]="advisor ? advisor.lastName : '' "
  [contentSubtitle]="advisor ? advisor.email : '' "
  [image] = false
  (cancelClicked)="onHandleCancel()"
  (saveClicked)="onHandleSave()"
>
  <p> {{ advisor?.id }} </p>
  <p> {{ advisor?.firstName }} </p>
  <p> {{ advisor?.email }} </p>

</app-card>
