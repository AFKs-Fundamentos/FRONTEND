<p-card *ngIf="product" [style]="{ 'text-align': 'center' }">
  <ng-template #header>
    <h2>{{ product.productName }}</h2>
  </ng-template>


  <div class="product-container">
    <img [src]="product.photo"
           alt="Imagen del producto"
           class="product-image" />

    <div class="product-details">
      <p><strong>Precio:</strong> {{ product.price | currency }}</p>
      <p><strong>Descripción:</strong> {{ product.description }}</p>
      <p><strong>Categoría:</strong> {{ product.category }}</p>
      <p><strong>SKU:</strong> {{ product.sku }}</p>
      <p><strong>Id:</strong> {{ product.id }}</p>
    </div>
  </div>

  <ng-template #footer>
    <p-button
      *ngIf="currentUserRole !== 'ROLE_TECHNICIAN'"
      icon="pi pi-shopping-cart"
      label="Añadir al carrito"
      (click)="addToCart(product)">
    </p-button>

    <p-button
      *ngIf="currentUserRole !== 'ROLE_TECHNICIAN'"
      icon="pi pi-shopping-cart"
      label="Dejar una reseña"
      (click)="showRating()">
    </p-button>
  </ng-template>
</p-card>

<ng-container *ngIf="product">
  <br/>
  <app-ratings-by-context [context]="'product'" [contextId]="product.id"></app-ratings-by-context>
  <br/>
  
  <p-dialog
  [(visible)]="showRatingD"
  header="Agregar Nueva Reseña"
  [modal]="true"
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false">
  <app-rating-form [id]="product.id" [context]="'product'" (dialogClosed)="closeDialogRating()"></app-rating-form></p-dialog>
  
</ng-container>
